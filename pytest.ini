[pytest]
minversion = 9.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = src
log_cli = false
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = 
    --capture=fd
    --no-cov-on-fail
    --import-mode=importlib
    --strict-markers
    --tb=short
    --cov=openai_client
    --cov-report=term-missing
    --cov-report=html
    --cache-clear
